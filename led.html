<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Control</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  button { background: #333; color: #eee; border: none; border-radius: 10px; padding: 12px; font-size: 15px; margin: 4px; cursor: pointer; }
  button:active { background: #555; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
  input[type=color] { width: 60px; height: 44px; border: none; background: none; padding: 0; }
  input[type=range] { width: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #222; cursor: pointer; }
  .status { font-size: 13px; color: #888; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>ELK-BLEDOM</h1>
<div class="status" id="status">Не подключено</div>

<div class="row">
  <button id="connect">Подключить</button>
  <button id="on">Вкл</button>
  <button id="off">Выкл</button>
</div>

<div class="row">
  <input type="color" id="picker" value="#ff0000">
  <button id="apply">Применить цвет</button>
  <button id="save">Сохранить цвет</button>
</div>

<div class="row" style="flex-direction:column; align-items:stretch">
  <label>Яркость: <span id="brightVal">100</span>%</label>
  <input type="range" id="bright" min="0" max="100" value="100">
</div>

<h3>Мои цвета</h3>
<div class="swatches" id="swatches"></div>

<h3>Эффекты</h3>
<div class="row">
  <button data-fx="0x80">Плавная смена</button>
  <button data-fx="0x81">Вспышки</button>
  <button data-fx="0x82">Пульс</button>
  <button data-fx="0x83">Радуга</button>
</div>

<script>
const SERVICE = '0000fff0-0000-1000-8000-00805f9b34fb';
const CHAR = '0000fff3-0000-1000-8000-00805f9b34fb';

let characteristic = null;
let device = null;
let savedColors = JSON.parse(localStorage.getItem('ledColors') || '[]');

const $ = id => document.getElementById(id);
const status = msg => $('status').textContent = msg;

async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ELK' }, { namePrefix: 'QHM' }, { namePrefix: 'LED' }],
      optionalServices: [SERVICE]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    characteristic = await service.getCharacteristic(CHAR);
    status('Подключено: ' + device.name);
  } catch (e) {
    status('Ошибка: ' + e.message);
  }
}

async function send(bytes) {
  if (!characteristic) { status('Сначала подключитесь'); return; }
  await characteristic.writeValueWithoutResponse(new Uint8Array(bytes));
}

const hexToRgb = hex => [
  parseInt(hex.slice(1, 3), 16),
  parseInt(hex.slice(3, 5), 16),
  parseInt(hex.slice(5, 7), 16)
];

async function setColor(hex) {
  const [r, g, b] = hexToRgb(hex);
  await send([0x7E, 0x00, 0x05, 0x03, r, g, b, 0x00, 0xEF]);
}

async function setBrightness(percent) {
  // Яркость масштабируем цветом: умножаем RGB на процент
  const [r, g, b] = hexToRgb($('picker').value);
  const k = percent / 100;
  await send([0x7E, 0x00, 0x05, 0x03,
    Math.round(r * k), Math.round(g * k), Math.round(b * k), 0x00, 0xEF]);
}

function renderSwatches() {
  const box = $('swatches');
  box.innerHTML = '';
  savedColors.forEach((hex, i) => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.style.background = hex;
    el.title = 'Нажмите — применить, долгое нажатие — удалить';
    el.onclick = () => { $('picker').value = hex; setColor(hex); };
    el.oncontextmenu = e => {
      e.preventDefault();
      savedColors.splice(i, 1);
      localStorage.setItem('ledColors', JSON.stringify(savedColors));
      renderSwatches();
    };
    box.appendChild(el);
  });
}

$('connect').onclick = connect;
$('on').onclick = () => send([0x7E, 0x00, 0x04, 0xF0, 0x00, 0x01, 0xFF, 0x00, 0xEF]);
$('off').onclick = () => send([0x7E, 0x00, 0x04, 0x00, 0x00, 0x00, 0xFF, 0x00, 0xEF]);
$('apply').onclick = () => setColor($('picker').value);

$('save').onclick = () => {
  const hex = $('picker').value;
  if (!savedColors.includes(hex)) {
    savedColors.push(hex);
    localStorage.setItem('ledColors', JSON.stringify(savedColors));
    renderSwatches();
  }
};

$('bright').oninput = e => {
  $('brightVal').textContent = e.target.value;
  setBrightness(+e.target.value);
};

document.querySelectorAll('[data-fx]').forEach(btn => {
  btn.onclick = () => send([0x7E, 0x00, 0x03, parseInt(btn.dataset.fx), 0x03, 0xFF, 0xFF, 0xFF, 0xEF].slice(0, 9));
});

renderSwatches();
</script>
</body>
</html>

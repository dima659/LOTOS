<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Control</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h3 { margin: 18px 0 8px; font-size: 16px; }
  button { background: #333; color: #eee; border: none; border-radius: 10px; padding: 12px; font-size: 15px; margin: 4px; cursor: pointer; }
  button:active { background: #555; }
  button.active { background: #2a6df4; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
  input[type=color] { width: 60px; height: 44px; border: none; background: none; padding: 0; }
  input[type=range] { width: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #222; cursor: pointer; }
  .status { font-size: 13px; color: #888; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>ELK-BLEDOM</h1>
<div class="status" id="status">Не подключено</div>

<div class="row">
  <button id="connect">Подключить</button>
  <button id="on">Вкл</button>
  <button id="off">Выкл</button>
</div>

<div class="row">
  <input type="color" id="picker" value="#ff0000">
  <input type="color" id="picker2" value="#0000ff">
  <button id="apply">Применить цвет</button>
  <button id="save">Сохранить</button>
</div>

<div class="row" style="flex-direction:column; align-items:stretch">
  <label>Яркость: <span id="brightVal">100</span>%</label>
  <input type="range" id="bright" min="0" max="100" value="100">
  <label>Скорость: <span id="speedVal">5</span></label>
  <input type="range" id="speed" min="1" max="10" value="5">
</div>

<h3>Мои цвета</h3>
<div class="swatches" id="swatches"></div>
<div class="status">Цвет 1 и Цвет 2 используются в эффектах. Долгое нажатие на цвет — удалить.</div>

<h3>Эффекты</h3>
<div class="row">
  <button data-fx="gradient">Переливание</button>
  <button data-fx="wave">Волна</button>
  <button data-fx="rainbow">Радуга</button>
  <button data-fx="pulse">Пульс</button>
  <button id="stopfx">Стоп</button>
</div>

<script>
const SERVICE = '0000fff0-0000-1000-8000-00805f9b34fb';
const CHAR = '0000fff3-0000-1000-8000-00805f9b34fb';

let characteristic = null, device = null;
let brightPct = 100;
let savedColors = JSON.parse(localStorage.getItem('ledColors') || '[]');

// Очередь: храним только последний кадр, лишние кадры пропускаем
let pending = null;      // [r,g,b] ещё не отправленный кадр
let writing = false;

const $ = id => document.getElementById(id);
const setStatus = msg => $('status').textContent = msg;

async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ELK' }, { namePrefix: 'QHM' }, { namePrefix: 'LED' }],
      optionalServices: [SERVICE]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    characteristic = await service.getCharacteristic(CHAR);
    setStatus('Подключено: ' + device.name);
  } catch (e) {
    setStatus('Ошибка: ' + e.message);
  }
}

async function sendRaw(bytes) {
  if (!characteristic) { setStatus('Сначала подключитесь'); return; }
  await characteristic.writeValueWithoutResponse(new Uint8Array(bytes));
}

// Отправитель: раз в 60 мс шлёт последний кадр, если предыдущая запись завершилась
setInterval(async () => {
  if (!characteristic || writing || !pending) return;
  const [r, g, b] = pending;
  pending = null;
  writing = true;
  try {
    await sendRaw([0x7E, 0x00, 0x05, 0x03, r, g, b, 0x00, 0xEF]);
  } catch (e) {
    setStatus('Ошибка записи: ' + e.message);
  } finally {
    writing = false;
  }
}, 60);

// Ставит кадр в очередь с учётом яркости
function setFrame(r, g, b) {
  const k = brightPct / 100;
  pending = [Math.round(r * k), Math.round(g * k), Math.round(b * k)];
}

const hexToRgb = hex => [
  parseInt(hex.slice(1, 3), 16),
  parseInt(hex.slice(3, 5), 16),
  parseInt(hex.slice(5, 7), 16)
];

const mix = (a, b, t) => [0, 1, 2].map(i => a[i] + (b[i] - a[i]) * t);
const ease = p => (1 - Math.cos(p)) / 2; // плавный переход туда-обратно

function hsvToRgb(h) {
  const k = n => Math.max(0, Math.min(1, Math.min((h / 60 + n) % 6, 4 - (h / 60 + n) % 6, 1)));
  return [k(5) * 255, k(3) * 255, k(1) * 255];
}

// Эффекты: fx(t) где t — время в секундах, возвращает [r,g,b]
const effects = {
  gradient: t => mix(hexToRgb($('picker').value), hexToRgb($('picker2').value), ease(t * Math.PI * 2)),
  wave:     t => {
    const a = hexToRgb($('picker').value), b = hexToRgb($('picker2').value);
    const k = ease(t * Math.PI * 2);
    return mix(a, b, k * k); // чуть дольше держится на каждом цвете
  },
  rainbow:  t => hsvToRgb((t * 40) % 360),
  pulse:    t => hexToRgb($('picker').value).map(v => v * ease(t * Math.PI * 2))
};

let animId = null, animName = null, startTime = 0;

function stopAnim() {
  if (animId) cancelAnimationFrame(animId);
  animId = null; animName = null;
  document.querySelectorAll('[data-fx]').forEach(b => b.classList.remove('active'));
}

// Плавный цикл через requestAnimationFrame, время берётся реальное
function loop(now) {
  const speed = +$('speed').value;      // 1..10
  const cyclesPerSec = 0.05 + speed * 0.03; // медленно при 1, быстрее при 10
  const t = (now - startTime) / 1000 * cyclesPerSec;
  const [r, g, b] = effects[animName](t);
  setFrame(r, g, b);
  animId = requestAnimationFrame(loop);
}

function startAnim(name) {
  stopAnim();
  animName = name;
  startTime = performance.now();
  document.querySelector(`[data-fx="${name}"]`).classList.add('active');
  animId = requestAnimationFrame(loop);
}

function renderSwatches() {
  const box = $('swatches');
  box.innerHTML = '';
  savedColors.forEach((hex, i) => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.style.background = hex;
    el.onclick = () => { stopAnim(); $('picker').value = hex; setFrame(...hexToRgb(hex)); };
    el.oncontextmenu = e => {
      e.preventDefault();
      savedColors.splice(i, 1);
      localStorage.setItem('ledColors', JSON.stringify(savedColors));
      renderSwatches();
    };
    box.appendChild(el);
  });
}

$('connect').onclick = connect;
$('on').onclick = () => sendRaw([0x7E, 0x00, 0x04, 0xF0, 0x00, 0x01, 0xFF, 0x00, 0xEF]).catch(e => setStatus(e.message));
$('off').onclick = () => { stopAnim(); sendRaw([0x7E, 0x00, 0x04, 0x00, 0x00, 0x00, 0xFF, 0x00, 0xEF]).catch(e => setStatus(e.message)); };
$('stopfx').onclick = stopAnim;
$('apply').onclick = () => { stopAnim(); setFrame(...hexToRgb($('picker').value)); };

$('save').onclick = () => {
  const hex = $('picker').value;
  if (!savedColors.includes(hex)) {
    savedColors.push(hex);
    localStorage.setItem('ledColors', JSON.stringify(savedColors));
    renderSwatches();
  }
};

$('bright').oninput = e => {
  brightPct = +e.target.value;
  $('brightVal').textContent = brightPct;
};

$('speed').oninput = e => { $('speedVal').textContent = e.target.value; };

document.querySelectorAll('[data-fx]').forEach(btn => {
  btn.onclick = () => startAnim(btn.dataset.fx);
});

renderSwatches();
</script>
</body>
</html>

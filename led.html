<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Control</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h3 { margin: 18px 0 8px; font-size: 16px; }
  button { background: #333; color: #eee; border: none; border-radius: 10px; padding: 12px; font-size: 15px; margin: 4px; cursor: pointer; }
  button:active { background: #555; }
  button.active { background: #2a6df4; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
  input[type=color] { width: 60px; height: 44px; border: none; background: none; padding: 0; }
  input[type=range] { width: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #222; cursor: pointer; }
  .status { font-size: 13px; color: #888; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>ELK-BLEDOM</h1>
<div class="status" id="status">Не подключено</div>

<div class="row">
  <button id="connect">Подключить</button>
  <button id="on">Вкл</button>
  <button id="off">Выкл</button>
</div>

<div class="row">
  <input type="color" id="picker" value="#ff0000">
  <input type="color" id="picker2" value="#0000ff">
  <button id="apply">Применить цвет</button>
  <button id="save">Сохранить</button>
</div>

<div class="row" style="flex-direction:column; align-items:stretch">
  <label>Яркость: <span id="brightVal">100</span>%</label>
  <input type="range" id="bright" min="0" max="100" value="100">
  <label>Скорость эффекта: <span id="speedVal">5</span></label>
  <input type="range" id="speed" min="1" max="10" value="5">
</div>

<h3>Мои цвета</h3>
<div class="swatches" id="swatches"></div>
<div class="status">Нажми цвет — применить. Долгое нажатие — удалить. Цвет 1 и Цвет 2 (справа от кнопок) используются в переливании.</div>

<h3>Эффекты</h3>
<div class="row">
  <button data-fx="gradient">Переливание</button>
  <button data-fx="rainbow">Радуга</button>
  <button data-fx="pulse">Пульс</button>
  <button id="stopfx">Стоп</button>
</div>

<script>
const SERVICE = '0000fff0-0000-1000-8000-00805f9b34fb';
const CHAR = '0000fff3-0000-1000-8000-00805f9b34fb';

let characteristic = null, device = null;
let busy = false, anim = null, brightPct = 100, phase = 0;
let savedColors = JSON.parse(localStorage.getItem('ledColors') || '[]');

const $ = id => document.getElementById(id);
const setStatus = msg => $('status').textContent = msg;

async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ELK' }, { namePrefix: 'QHM' }, { namePrefix: 'LED' }],
      optionalServices: [SERVICE]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    characteristic = await service.getCharacteristic(CHAR);
    setStatus('Подключено: ' + device.name);
  } catch (e) {
    setStatus('Ошибка: ' + e.message);
  }
}

async function send(bytes) {
  if (!characteristic || busy) return;
  busy = true;
  try {
    await characteristic.writeValueWithoutResponse(new Uint8Array(bytes));
  } catch (e) {
    setStatus('Ошибка записи: ' + e.message);
  } finally {
    busy = false;
  }
}

// отправка RGB с учётом яркости
function sendRGB(r, g, b) {
  const k = brightPct / 100;
  send([0x7E, 0x00, 0x05, 0x03,
    Math.round(r * k), Math.round(g * k), Math.round(b * k), 0x00, 0xEF]);
}

const hexToRgb = hex => [
  parseInt(hex.slice(1, 3), 16),
  parseInt(hex.slice(3, 5), 16),
  parseInt(hex.slice(5, 7), 16)
];

const lerp = (a, b, p) => a + (b - a) * p;

function hsvToRgb(h, s, v) {
  const f = n => {
    const k = (n + h / 60) % 6;
    return v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
  };
  return [f(5) * 255, f(3) * 255, f(1) * 255];
}

function stopAnim() {
  if (anim) { clearInterval(anim); anim = null; }
  document.querySelectorAll('[data-fx]').forEach(b => b.classList.remove('active'));
}

// запуск эффекта: fn(phase) возвращает [r,g,b]
function startAnim(name, fn) {
  stopAnim();
  phase = 0;
  document.querySelector(`[data-fx="${name}"]`).classList.add('active');
  const speed = +$('speed').value;
  const interval = 400 - speed * 30; // 370 мс при скорости 1, 100 мс при 10
  anim = setInterval(() => {
    const [r, g, b] = fn(phase);
    sendRGB(r, g, b);
    phase += 0.05 + speed * 0.01;
  }, interval);
}

// Переливание: плавный переход от Цвет 1 к Цвет 2 и обратно
function gradientFx(p) {
  const a = hexToRgb($('picker').value);
  const b = hexToRgb($('picker2').value);
  const t = (1 - Math.cos(p)) / 2;
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}

// Радуга: плавный переход по всему цветовому кругу
function rainbowFx(p) {
  return hsvToRgb((p * 60) % 360, 1, 1);
}

// Пульс: Цвет 1 плавно затухает и загорается
function pulseFx(p) {
  const a = hexToRgb($('picker').value);
  const k = (1 - Math.cos(p)) / 2;
  return a.map(v => v * k);
}

function renderSwatches() {
  const box = $('swatches');
  box.innerHTML = '';
  savedColors.forEach((hex, i) => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.style.background = hex;
    el.onclick = () => { stopAnim(); $('picker').value = hex; sendRGB(...hexToRgb(hex)); };
    el.oncontextmenu = e => {
      e.preventDefault();
      savedColors.splice(i, 1);
      localStorage.setItem('ledColors', JSON.stringify(savedColors));
      renderSwatches();
    };
    box.appendChild(el);
  });
}

$('connect').onclick = connect;
$('on').onclick = () => { send([0x7E, 0x00, 0x04, 0xF0, 0x00, 0x01, 0xFF, 0x00, 0xEF]); };
$('off').onclick = () => { stopAnim(); send([0x7E, 0x00, 0x04, 0x00, 0x00, 0x00, 0xFF, 0x00, 0xEF]); };
$('stopfx').onclick = stopAnim;

$('apply').onclick = () => { stopAnim(); sendRGB(...hexToRgb($('picker').value)); };

$('save').onclick = () => {
  const hex = $('picker').value;
  if (!savedColors.includes(hex)) {
    savedColors.push(hex);
    localStorage.setItem('ledColors', JSON.stringify(savedColors));
    renderSwatches();
  }
};

$('bright').oninput = e => {
  brightPct = +e.target.value;
  $('brightVal').textContent = brightPct;
};

$('speed').oninput = e => {
  $('speedVal').textContent = e.target.value;
  if (anim) {
    const name = document.querySelector('[data-fx].active').dataset.fx;
    startAnim(name, fxs[name]);
  }
};

const fxs = { gradient: gradientFx, rainbow: rainbowFx, pulse: pulseFx };

document.querySelectorAll('[data-fx]').forEach(btn => {
  btn.onclick = () => startAnim(btn.dataset.fx, fxs[btn.dataset.fx]);
});

renderSwatches();
</script>
</body>
</html>
